<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DHSGSU Campus Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F5F5F5;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            zoomControl: false
        }).setView([23.8315, 78.7810], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = [];
        var userMarker = null;

        function addMarker(lat, lng, title) {
            var marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup(title);
            marker.on('click', function() {
                if (window.AndroidBridge && window.AndroidBridge.onMarkerSelected) {
                    window.AndroidBridge.onMarkerSelected(title, lat, lng);
                }
            });
            markers.push(marker);
            return marker;
        }

        // Default Campus Markers
        addMarker(23.8318, 78.7805, "Campus Security Office");
        addMarker(23.8312, 78.7818, "Health Centre");
        addMarker(23.8325, 78.7822, "Boys Hostel Block C");

        function setTarget(lat, lng, title) {
            var targetMarker = L.marker([lat, lng]).addTo(map);
            targetMarker.bindPopup(title).openPopup();
            targetMarker.on('click', function() {
                if (window.AndroidBridge && window.AndroidBridge.onMarkerSelected) {
                    window.AndroidBridge.onMarkerSelected(title, lat, lng);
                }
            });
            map.setView([lat, lng], 17);
        }

        function showUserLocation(lat, lng) {
            if (userMarker) {
                map.removeLayer(userMarker);
            }
            var userIcon = L.divIcon({
                className: 'user-location-marker',
                html: '<div style="background-color: #2196F3; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>',
                iconSize: [16, 16]
            });
            userMarker = L.marker([lat, lng], {icon: userIcon}).addTo(map);
            userMarker.bindPopup("📍 Your Current Location").openPopup();
            map.setView([lat, lng], 17);
        }

        function centerMap(lat, lng) {
            map.setView([lat, lng || 78.7810], 16.5);
        }

        function zoomIn() {
            map.zoomIn();
        }

        function zoomOut() {
            map.zoomOut();
        }
    </script>
</body>
</html>
